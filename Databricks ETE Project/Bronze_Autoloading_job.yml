resources:
  jobs:
    Bronze_Autoloading_job:
      name: Bronze_Autoloading_job
      tasks:
        - task_key: Bronze_Incremental
          notebook_task:
            notebook_path: Azure-Databricks-End-To-End-Project/DatabricksETE Project/Parameters
            source: WORKSPACE
          existing_cluster_id: 0814-115404-ereaddlw
        - task_key: Bronze_Autoloader
          depends_on:
            - task_key: Bronze_Incremental
          for_each_task:
            inputs: "{{tasks.Bronze_Incremental.values.my_arr}}"
            task:
              task_key: Bronze_Autoloader_iteration
              notebook_task:
                notebook_path: Azure-Databricks-End-To-End-Project/DatabricksETE Project/Bronze_Layer
                base_parameters:
                  file_name: "{{input.fileName}}"
                source: WORKSPACE
              existing_cluster_id: 0814-115404-ereaddlw
      git_source:
        git_url: https://github.com/Temoukam-Franck/Azure-Databricks-End-To-End-Project
        git_provider: gitHub
        git_branch: feature_1
      queue:
        enabled: true
